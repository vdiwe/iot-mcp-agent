[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iot-mcp-agent"
version = "0.1.0"
description = "Agentic AI for Industrial IoT using the Model Context Protocol (MCP)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Vachaspati Diwevedi", email = "vachhy@gmail.com" }]
keywords = ["iot", "mcp", "agentic-ai", "cumulocity", "llm", "industrial-iot"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Monitoring",
]
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40.0",
  "mcp>=1.0.0",
  "c8y-api>=2.0.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "ruff>=0.6.0", "mypy>=1.11.0"]
openai = ["openai>=1.0.0"]
gemini = ["google-genai>=1.0.0"]
all = ["openai>=1.0.0", "google-genai>=1.0.0"]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/iot-mcp-agent"
Documentation = "https://github.com/YOUR_USERNAME/iot-mcp-agent/blob/main/README.md"
Issues = "https://github.com/YOUR_USERNAME/iot-mcp-agent/issues"

[project.scripts]
iot-mcp-agent = "iot_mcp_agent.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/iot_mcp_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
